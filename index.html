<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-LKPD Interaktif IPA - Usaha & Energi</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Poppins & Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            poppins: ['Poppins', 'sans-serif'],
            nunito: ['Nunito', 'sans-serif'],
          },
          colors: {
            brand: {
              navy: '#0B2545',
              blue: '#0D6EFD',
              yellow: '#FDC82F',
              purple: '#6B38FB',
              emerald: '#10B981',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background-color: #F8FAFC;
      color: #1E293B;
    }
    h1, h2, h3, h4, .font-heading {
      font-family: 'Poppins', sans-serif;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <!-- Application Wrapper -->
  <div id="app" class="flex-1 flex flex-col max-w-[1600px] w-full mx-auto p-2 sm:p-4 lg:p-6 gap-3">
    
    <div class="bg-white rounded-3xl shadow-lg border border-slate-200 flex-1 flex flex-col md:flex-row overflow-hidden min-h-[800px] relative">
      
      <!-- Main Sidebar -->
      <aside class="w-full md:w-72 bg-brand-navy text-white flex flex-col justify-between p-5 shrink-0">
        <div class="space-y-4">
          <!-- Institutional Header -->
          <div class="text-center pb-4 border-b border-slate-700/60">
            <span class="text-[10px] font-black text-brand-yellow uppercase tracking-wider block font-heading">UNIVERSITAS NEGERI GORONTALO</span>
            <h1 class="text-base font-extrabold text-white uppercase font-heading mt-0.5">E-LKPD IPA STEAM</h1>
            <span class="text-xs text-slate-300 font-semibold block mt-1">Materi Usaha & Energi</span>
          </div>

          <!-- Active User Badge -->
          <div id="user-info-card" class="bg-slate-800/80 border border-slate-700 rounded-2xl p-3 text-center">
            <span class="text-[10px] font-extrabold text-slate-400 block uppercase tracking-wider">Status Login</span>
            <span id="user-display-name" class="text-xs font-black text-white block mt-0.5">Belum Login</span>
            <span id="user-display-role" class="inline-block mt-1 px-2 py-0.5 bg-slate-700 text-slate-300 text-[9px] font-extrabold rounded-full uppercase">-</span>
          </div>

          <!-- Navigation Menu -->
          <nav id="sidebar-nav" class="space-y-1.5 font-medium text-xs">
            <!-- Navigasi dirender dinamis berdasarkan Role -->
          </nav>
        </div>

        <!-- System Action Button -->
        <div class="pt-4 border-t border-slate-700/60">
          <button id="auth-action-btn" onclick="openLoginModal()" class="w-full py-2.5 bg-brand-blue hover:bg-blue-600 text-white font-black rounded-xl text-xs transition shadow flex items-center justify-center gap-2">
            <span>🔑 Login / Ganti Akun</span>
          </button>
        </div>
      </aside>

      <!-- Main Content Area -->
      <main class="flex-1 flex flex-col bg-slate-50 relative overflow-y-auto">
        
        <!-- Header Bar -->
        <header class="p-4 bg-white border-b border-slate-200 flex items-center justify-between sticky top-0 z-10 shadow-xs">
          <div>
            <h2 id="view-title" class="text-lg font-black text-brand-navy font-heading">BERANDA</h2>
            <p id="view-subtitle" class="text-xs text-slate-500 font-medium">Selamat datang di E-LKPD Interaktif IPA STEAM</p>
          </div>
          
          <div class="flex items-center gap-2">
            <span id="role-badge" class="px-3 py-1 bg-slate-100 border border-slate-200 text-slate-700 text-xs font-black rounded-xl">
              Mode Tamu
            </span>
          </div>
        </header>

        <!-- Dynamic Content Viewport -->
        <div id="content-viewport" class="flex-1 p-4 sm:p-6">
          <!-- View dirender oleh JavaScript -->
        </div>

      </main>

    </div>
  </div>

  <!-- MODAL AUTHENTICATION (LOGIN) -->
  <div id="login-modal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-xs z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-slate-200 space-y-4">
      <div class="text-center space-y-1">
        <div class="w-12 h-12 bg-blue-100 text-brand-blue rounded-2xl flex items-center justify-center text-xl font-bold mx-auto">🔑</div>
        <h3 class="text-lg font-black text-brand-navy font-heading">LOGIN E-LKPD</h3>
        <p class="text-xs text-slate-500">Masukkan username dan password kamu</p>
      </div>

      <form onsubmit="handleLoginSubmit(event)" class="space-y-3 text-xs">
        <div>
          <label class="block font-bold text-slate-700 mb-1">Username / NIS / NIP</label>
          <input type="text" id="login-username" required placeholder="Contoh: admin, guru.ipa, atau 8001" class="w-full p-3 rounded-xl border border-slate-300 font-bold focus:ring-2 focus:ring-brand-blue focus:outline-none" />
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">Password</label>
          <input type="password" id="login-password" required placeholder="Masukkan password" class="w-full p-3 rounded-xl border border-slate-300 font-bold focus:ring-2 focus:ring-brand-blue focus:outline-none" />
        </div>

        <div id="login-error-msg" class="hidden text-xs text-red-600 font-bold text-center bg-red-50 p-2 rounded-xl border border-red-200"></div>

        <div class="flex gap-2 pt-2">
          <button type="button" onclick="closeLoginModal()" class="flex-1 py-2.5 bg-slate-100 text-slate-700 font-bold rounded-xl hover:bg-slate-200 transition">
            Batal
          </button>
          <button type="submit" id="btn-submit-login" class="flex-1 py-2.5 bg-brand-blue text-white font-black rounded-xl shadow hover:bg-blue-600 transition">
            Masuk
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- JAVASCRIPT APP LOGIC -->
  <script>
    /* ==========================================================
       1. KONFIGURASI API & STATE GLOBAL
       ========================================================== */
    // TEMPELKAN URL WEB APP GAS HASIL DEPLOY TAHAP 1 DI SINI:
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbxb6KPt_wknC7BiqMSkd9QSMF2t158GLj5xxHUVQOCzIgbndw8ysQbTEZHWud8Gnlu0/exec';

    const state = {
      currentUser: null, // { id, username, name, role, kelas }
      currentView: 'home'
    };

    /* ==========================================================
       2. AUTENTIKASI & KONTROL AKSES (ROLE-BASED)
       ========================================================== */
    async function handleLoginSubmit(e) {
      e.preventDefault();
      const un = document.getElementById('login-username').value.trim();
      const pw = document.getElementById('login-password').value.trim();
      const errorMsg = document.getElementById('login-error-msg');
      const submitBtn = document.getElementById('btn-submit-login');

      errorMsg.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Memproses...';

      try {
        const res = await fetch(GAS_API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'login', username: un, password: pw })
        });
        const result = await res.json();

        if (result.success) {
          state.currentUser = result.user;
          closeLoginModal();
          updateUIForAuthenticatedUser();
          
          // Redirect sesuai Role
          if (result.user.role === 'admin') switchView('admin-users');
          else if (result.user.role === 'guru') switchView('guru-dashboard');
          else switchView('siswa-materi');

        } else {
          errorMsg.textContent = result.message || 'Login gagal!';
          errorMsg.classList.remove('hidden');
        }
      } catch (err) {
        errorMsg.textContent = 'Gagal terhubung ke server database!';
        errorMsg.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Masuk';
      }
    }

    function logout() {
      state.currentUser = null;
      updateUIForAuthenticatedUser();
      switchView('home');
    }

    function updateUIForAuthenticatedUser() {
      const nameElem = document.getElementById('user-display-name');
      const roleElem = document.getElementById('user-display-role');
      const badgeElem = document.getElementById('role-badge');
      const authBtn = document.getElementById('auth-action-btn');

      if (state.currentUser) {
        nameElem.textContent = state.currentUser.name;
        roleElem.textContent = state.currentUser.role.toUpperCase();
        badgeElem.textContent = `${state.currentUser.role.toUpperCase()}: ${state.currentUser.name}`;
        badgeElem.className = 'px-3 py-1 bg-blue-100 border border-blue-200 text-brand-blue text-xs font-black rounded-xl';
        
        authBtn.className = 'w-full py-2.5 bg-red-100 hover:bg-red-200 text-red-700 font-black rounded-xl text-xs transition flex items-center justify-center gap-2';
        authBtn.innerHTML = '<span>🚪 Keluar (Logout)</span>';
        authBtn.onclick = logout;
      } else {
        nameElem.textContent = 'Belum Login';
        roleElem.textContent = '-';
        badgeElem.textContent = 'Mode Tamu';
        badgeElem.className = 'px-3 py-1 bg-slate-100 border border-slate-200 text-slate-700 text-xs font-black rounded-xl';

        authBtn.className = 'w-full py-2.5 bg-brand-blue hover:bg-blue-600 text-white font-black rounded-xl text-xs transition shadow flex items-center justify-center gap-2';
        authBtn.innerHTML = '<span>🔑 Login / Ganti Akun</span>';
        authBtn.onclick = openLoginModal;
      }

      renderSidebarNav();
    }

    /* ==========================================================
       3. NAVIGATION & SIDEBAR MANAGER
       ========================================================== */
    function renderSidebarNav() {
      const navContainer = document.getElementById('sidebar-nav');
      navContainer.innerHTML = '';

      let items = [
        { id: 'home', title: 'Beranda E-LKPD', icon: '🏠', roles: ['guest', 'admin', 'guru', 'siswa'] }
      ];

      // Menu Khusus Admin
      if (state.currentUser?.role === 'admin') {
        items.push(
          { id: 'admin-users', title: 'Kelola Pengguna', icon: '👥', roles: ['admin'] }
        );
      }

      // Menu Khusus Guru
      if (state.currentUser?.role === 'guru') {
        items.push(
          { id: 'guru-dashboard', title: 'Dashboard Guru', icon: '📊', roles: ['guru'] },
          { id: 'guru-konten', title: 'Kelola Konten LKPD', icon: '📝', roles: ['guru'] },
          { id: 'guru-soal', title: 'Kelola Bank Soal', icon: '❓', roles: ['guru'] }
        );
      }

      // Menu Khusus Siswa / Tamu
      if (!state.currentUser || state.currentUser?.role === 'siswa') {
        items.push(
          { id: 'siswa-materi', title: 'Materi IPA Interaktif', icon: '📖', roles: ['siswa', 'guest'] },
          { id: 'siswa-lkpd', title: 'Isi Lembar E-LKPD', icon: '✏️', roles: ['siswa'] },
          { id: 'siswa-nilai', title: 'Hasil & Nilai Saya', icon: '🏆', roles: ['siswa'] }
        );
      }

      items.forEach(item => {
        const btn = document.createElement('button');
        const isActive = state.currentView === item.id;
        btn.onclick = () => switchView(item.id);
        btn.className = `w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-heading transition-all text-left ${
          isActive ? 'bg-brand-yellow text-brand-navy font-bold shadow' : 'text-slate-300 hover:bg-slate-800 hover:text-white'
        }`;
        btn.innerHTML = `<span class="text-sm">${item.icon}</span><span>${item.title}</span>`;
        navContainer.appendChild(btn);
      });
    }

    /* ==========================================================
       4. ROUTER VIEW SWITCHER
       ========================================================== */
    function switchView(viewId) {
      state.currentView = viewId;
      renderSidebarNav();

      const viewport = document.getElementById('content-viewport');
      const titleElem = document.getElementById('view-title');
      const subtitleElem = document.getElementById('view-subtitle');

      switch (viewId) {
        case 'home':
          titleElem.textContent = 'BERANDA';
          subtitleElem.textContent = 'E-LKPD Interaktif IPA STEAM UNG';
          viewport.innerHTML = renderHomeView();
          break;

        case 'admin-users':
          titleElem.textContent = 'MANAJEMEN PENGGUNA';
          subtitleElem.textContent = 'Tambah dan atur akun Admin, Guru, dan Siswa';
          viewport.innerHTML = `<div class="p-6 bg-white rounded-3xl border border-slate-200"><h3 class="font-black text-brand-navy">[Modul Admin: Kelola User - Akan dibangun di Tahap 3]</h3></div>`;
          break;

        case 'guru-dashboard':
          titleElem.textContent = 'DASHBOARD GURU';
          subtitleElem.textContent = 'Rekapitulasi dan penilain lembar kerja siswa';
          viewport.innerHTML = `<div class="p-6 bg-white rounded-3xl border border-slate-200"><h3 class="font-black text-brand-navy">[Modul Guru: Koreksi & Rekap - Akan dibangun di Tahap 3]</h3></div>`;
          break;

        case 'guru-konten':
          titleElem.textContent = 'KELOLA KONTEN LKPD';
          subtitleElem.textContent = 'Tambah dan ubah materi serta instruksi LKPD';
          viewport.innerHTML = `<div class="p-6 bg-white rounded-3xl border border-slate-200"><h3 class="font-black text-brand-navy">[Modul Guru: CRUD Konten - Akan dibangun di Tahap 3]</h3></div>`;
          break;

        case 'guru-soal':
          titleElem.textContent = 'KELOLA BANK SOAL';
          subtitleElem.textContent = 'Tambah dan ubah soal kuis evaluasi';
          viewport.innerHTML = `<div class="p-6 bg-white rounded-3xl border border-slate-200"><h3 class="font-black text-brand-navy">[Modul Guru: CRUD Soal - Akan dibangun di Tahap 3]</h3></div>`;
          break;

        case 'siswa-materi':
          titleElem.textContent = 'MATERI USAHA & ENERGI';
          subtitleElem.textContent = 'Pelajari konsep IPA berbasis STEAM';
          viewport.innerHTML = `<div class="p-6 bg-white rounded-3xl border border-slate-200"><h3 class="font-black text-brand-navy">[Modul Siswa: Materi & Simulasi - Akan dibangun di Tahap 4]</h3></div>`;
          break;

        case 'siswa-lkpd':
          titleElem.textContent = 'LEMBAR KERJA PESERTA DIDIK';
          subtitleElem.textContent = 'Isi jawaban dan gambar rancangan STEAM';
          viewport.innerHTML = `<div class="p-6 bg-white rounded-3xl border border-slate-200"><h3 class="font-black text-brand-navy">[Modul Siswa: Kanvas STEAM & Isian - Akan dibangun di Tahap 4]</h3></div>`;
          break;

        case 'siswa-nilai':
          titleElem.textContent = 'HASIL BELAJAR SAYA';
          subtitleElem.textContent = 'Lihat skor evaluasi dan catatan dari guru';
          viewport.innerHTML = `<div class="p-6 bg-white rounded-3xl border border-slate-200"><h3 class="font-black text-brand-navy">[Modul Siswa: Hasil & Nilai - Akan dibangun di Tahap 4]</h3></div>`;
          break;

        default:
          switchView('home');
      }
    }

    function renderHomeView() {
      return `
        <div class="space-y-4 max-w-4xl mx-auto">
          <div class="bg-brand-navy text-white p-6 sm:p-8 rounded-3xl shadow-lg space-y-3">
            <span class="px-3 py-1 bg-brand-yellow text-brand-navy font-black text-[10px] rounded-full uppercase tracking-wider font-heading">
              E-LKPD IPA SMP KELAS VIII
            </span>
            <h2 class="text-2xl sm:text-3xl font-black font-heading leading-tight">
              E-LKPD INTERAKTIF BERBASIS STEAM
            </h2>
            <p class="text-xs text-slate-300 max-w-xl">
              Platform pembelajaran digital berbasis Science, Technology, Engineering, Arts, dan Mathematics untuk materi Usaha dan Energi.
            </p>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div class="bg-white p-5 rounded-3xl border border-slate-200 space-y-2 text-center">
              <span class="text-2xl block">👑</span>
              <h4 class="font-black text-brand-navy text-xs font-heading">Role Admin</h4>
              <p class="text-[11px] text-slate-500">Mendaftarkan akun Guru dan Siswa ke sistem.</p>
            </div>

            <div class="bg-white p-5 rounded-3xl border border-slate-200 space-y-2 text-center">
              <span class="text-2xl block">👨‍🏫</span>
              <h4 class="font-black text-brand-navy text-xs font-heading">Role Guru</h4>
              <p class="text-[11px] text-slate-500">Mengelola materi/soal dan memberikan nilai LKPD.</p>
            </div>

            <div class="bg-white p-5 rounded-3xl border border-slate-200 space-y-2 text-center">
              <span class="text-2xl block">🎓</span>
              <h4 class="font-black text-brand-navy text-xs font-heading">Role Siswa</h4>
              <p class="text-[11px] text-slate-500">Mempelajari materi, mengisi kanvas STEAM, dan kuis.</p>
            </div>
          </div>
        </div>
      `;
    }

    /* ==========================================================
       5. MODAL UTILITIES
       ========================================================== */
    function openLoginModal() {
      document.getElementById('login-modal').classList.remove('hidden');
      document.getElementById('login-modal').classList.add('flex');
    }

    function closeLoginModal() {
      document.getElementById('login-modal').classList.add('hidden');
      document.getElementById('login-modal').classList.remove('flex');
      document.getElementById('login-error-msg').classList.add('hidden');
    }

    // INIT
    window.addEventListener('DOMContentLoaded', () => {
      updateUIForAuthenticatedUser();
      switchView('home');
    });
  </script>
</body>
</html>
